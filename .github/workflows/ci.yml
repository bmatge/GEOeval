name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-test:
    name: ruff + pytest (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geoeval
          POSTGRES_PASSWORD: geoeval
          POSTGRES_DB: geoeval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geoeval -d geoeval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://geoeval:geoeval@localhost:5432/geoeval
      GEOEVAL_SESSION_SECRET: ci-secret-not-for-prod
      GEOEVAL_COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image (contrat VibeLab / Nubo, ADR-088)
        run: docker build -t geoeval:ci .
