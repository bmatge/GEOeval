# Alembic — GEOeval (ADR-088 lot 1.4). L'URL vient de DATABASE_URL (env.py) ;
# en pratique on passe par `python -m scripts.migrate`, ce fichier sert aux
# commandes de développement :
#     alembic -c geoeval/db/alembic.ini revision --autogenerate -m "ma_modif"
#     alembic -c geoeval/db/alembic.ini upgrade head
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = ../..
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
