[tool.pytest.ini_options]
# Racine du dépôt sur sys.path : `geoeval` et `scripts` s'importent tels quels.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: nécessite PostgreSQL (DATABASE_URL) — sauté sinon",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs/spikes"]

[tool.ruff.lint]
# Périmètre volontairement restreint (ADR-088 lot 1) : erreurs réelles d'abord.
# Le style (E501, imports triés) viendra avec le découpage de webapp/app.py.
select = ["E", "F", "W"]
ignore = ["E501"]
